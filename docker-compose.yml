services:
  backend:
    image: ai-decision-backend:latest
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app:/app/backend:.
      - H2O_URL=http://h2o:54321
    depends_on:
      redis:
        condition: service_healthy
      h2o:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
      - uploads:/app/uploads
      - mlflow_data:/app/mlops
      - storage_data:/app/storage
      - models_data:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    image: ai-decision-frontend:latest
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  h2o:
    # Despite the "-k8s" tag, this is H2O.ai's standard minimal open-source H2O-3 image
    # (plain JVM process on port 54321) and runs fine under docker-compose; it's the only
    # official plain-H2O image they publish, there's no non-"-k8s" equivalent.
    # Keep this pinned to the exact same version as h2o== in backend/requirements.txt,
    # or the h2o-py client will reject the version mismatch and silently fall back.
    image: h2oai/h2o-open-source-k8s:3.46.0.1
    ports:
      - "54321:54321"
    environment:
      - H2O_NAME=ai_decision_cluster
      - H2O_MEM_SIZE=4g
    volumes:
      - uploads:/app/uploads
      - models_data:/app/models
      - h2o_data:/opt/h2o/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:54321/3/About"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.16.0
    ports:
      - "5000:5000"
    environment:
      - MLFLOW_ALLOW_FILE_STORE=true
    command: mlflow server --backend-store-uri sqlite:////mlflow/mlflow.db --default-artifact-root /mlflow --host 0.0.0.0 --port 5000 --allowed-hosts "*"
    volumes:
      - mlflow_data:/mlflow

  jupyter:
    image: ai-decision-jupyter:latest
    build:
      context: .
      dockerfile: Dockerfile.jupyter
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - PYTHONPATH=/app:/app/backend:.
      - BACKEND_URL=http://backend:8000
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - H2O_URL=http://h2o:54321
    volumes:
      - ./notebooks:/app/notebooks
      - ./models:/app/models
      - ./data:/app/data
      - uploads:/app/uploads
      - storage_data:/app/storage
      - models_data:/app/backend/models
    depends_on:
      backend:
        condition: service_healthy
      h2o:
        condition: service_healthy

volumes:
  redis_data:
  mlflow_data:
  uploads:
  storage_data:
  models_data:
  h2o_data: